<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neu Invoicing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f8fafc;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; }
      }
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(ellipse at top, #e0f2fe 0%, #f8fafc 55%);
        color: #0c4a6e;
        z-index: 9999;
        animation: splash-fade-in 0.25s ease-out;
      }
      @media (prefers-color-scheme: dark) {
        #app-splash {
          background: radial-gradient(ellipse at top, #0b2540 0%, #0f172a 55%);
          color: #e0f2fe;
        }
      }
      #app-splash .loader {
        position: relative;
        width: 88px;
        height: 88px;
      }
      #app-splash .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid rgba(14, 165, 233, 0.18);
        border-top-color: #0ea5e9;
        animation: splash-spin 0.85s linear infinite;
      }
      #app-splash .logo-plate {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 60px;
        height: 60px;
        transform: translate(-50%, -50%);
        background: #ffffff;
        border-radius: 14px;
        box-shadow:
          0 8px 20px -6px rgba(14, 116, 144, 0.28),
          0 2px 6px -1px rgba(15, 23, 42, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
        box-sizing: border-box;
      }
      @media (prefers-color-scheme: dark) {
        #app-splash .logo-plate {
          background: #1e293b;
          box-shadow:
            0 8px 22px -6px rgba(0, 0, 0, 0.55),
            0 2px 6px -1px rgba(0, 0, 0, 0.35);
        }
      }
      #app-splash .logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
        user-select: none;
      }
      #app-splash .brand {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-top: 4px;
      }
      #app-splash .brand span { color: #0ea5e9; }
      #app-splash .tagline {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #64748b;
      }
      @media (prefers-color-scheme: dark) {
        #app-splash .tagline { color: #94a3b8; }
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @keyframes splash-fade-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <div class="loader">
          <div class="ring"></div>
          <div class="logo-plate">
            <img class="logo" src="./COMPANY%20LOGO.png" alt="" />
          </div>
        </div>
        <div class="brand">Neu <span>Invoicing</span></div>
        <div class="tagline">Starting up</div>
      </div>
    </div>
    <script>
      // Catastrophic mount failure fallback: if React hasn't replaced #app-splash
      // after 8s, surface a diagnostic instead of leaving the user on a spinner.
      setTimeout(function () {
        if (document.getElementById('app-splash')) {
          var root = document.getElementById('root');
          root.innerHTML =
            '<div style="padding:48px;font-family:Inter,Arial,sans-serif;max-width:560px;margin:48px auto;">' +
            '<h1 style="color:#dc2626;margin:0 0 8px 0;">Failed to start</h1>' +
            '<p style="color:#475569;">The app loaded but the UI did not initialize. Please restart Neu Invoicing.</p>' +
            '<p style="color:#94a3b8;font-size:12px;margin-top:24px;">electronAPI available: ' +
            (!!window.electronAPI) + '</p>' +
            '</div>';
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
